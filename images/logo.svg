<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 173" width="400" height="173">
  <style>
    .logo-dark-version { display: none; }
    .logo-light-version { display: block; }
    @media (prefers-color-scheme: dark) {
      .logo-dark-version { display: block; }
      .logo-light-version { display: none; }
    }
    :root.dark .logo-dark-version,
    :root[data-theme="dark"] .logo-dark-version,
    html.dark .logo-dark-version,
    html.theme-dark .logo-dark-version {
      display: block !important;
    }
    :root.dark .logo-light-version,
    :root[data-theme="dark"] .logo-light-version,
    html.dark .logo-light-version,
    html.theme-dark .logo-light-version {
      display: none !important;
    }
  </style>
  <image class="logo-light-version" href="data:image/png;base64," width="400" height="173" />
  <image class="logo-dark-version" href="data:image/png;base64," width="400" height="173" />
</svg>